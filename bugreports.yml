- summary: |
    Приложение не адаптировано для мобильных устройств
  environment: |
    Google Chrome 149.0 (официальная сборка)
    macOS 15 (Apple Silicon)
  steps-to-reproduce: |
    - Открываем главную страницу магазина
    - Открываем DevTools
    - Нажимаем на кнопку «Режим адаптивного дизайна»
    - Выбираем IPhone 12 Pro
    - Смотрим, меняется ли внешний вид приложения
  expected-result: |
    Сайт адаптивен, верстка не сломана
  actual-result: |
    Сайт не адаптивен, верстка сломана

- summary: |
    Кнопка «Предыдущая» отображается на первой странице выбора товаров
  environment: |
    Google Chrome 149.0 (официальная сборка)
    macOS 15 (Apple Silicon)
  steps-to-reproduce: |
    1. Заходим на страницу магазина https://products-store-ru.hexlet.app/
  expected-result: |
    Не отображается кнопка «Предыдущая»
  actual-result: |
    Кнопка «Предыдущая» отображается только после перехода на следующую страницу

- summary: |
    Отображаются лишние кнопки «Предыдущая» и «Следующая» при нахождении на странице с одним товаром
  environment: |
    Google Chrome 149.0 (официальная сборка)
    macOS 15 (Apple Silicon)
  steps-to-reproduce: |
    1. Выбираем производителя Huawei
  expected-result: |
    Не отображаются кнопки «Предыдущая» и «Следующая»
  actual-result: |
    Отображаются кнопки «Предыдущая» и «Следующая»

- summary: |
    Отсутствует возможность увеличения изображения товара
  environment: |
    Google Chrome 149.0 (официальная сборка)
    macOS 15 (Apple Silicon)
  steps-to-reproduce: |
    1. Выбираем любой товар
    2. Нажимаем на него
    3. Нажимаем на изображение из нижнего ряда
  expected-result: |
    Изображение увечивается
  actual-result: |
    Ничего не происходит, изображение не увеличивается

- summary: |
    Нет перевода названий категорий товаров на русский язык при переходе в русскоязычную версию сайта
  environment: |
    Google Chrome 149.0 (официальная сборка)
    macOS 15 (Apple Silicon)
  steps-to-reproduce: |
    1. Выбрать русскоязычную версию сайта
    2. Нажать на значок выбора категорий
  expected-result: |
    Названия категорий товаров переводятся на русский язык
  actual-result: |
    Ничего не происходит, названия категорий товаров не переводятся на русский язык

- summary: |
    При нажатии на кнопку «Оформить заказ» DevTools выдает ошибку 500
  environment: |
    Google Chrome 149.0 (официальная сборка)
    macOS 15 (Apple Silicon)
  steps-to-reproduce: |
    1. Зайти в DevTools
    2. Добавить товар в корзину
    3. Зайти в корзину
    4. Нажать на кнопку «Оформить заказ»
  expected-result: |
    Нет ошибки, данные передаются на сервер
  actual-result: |
    Выдается ошибка, данные не передаются на сервер

