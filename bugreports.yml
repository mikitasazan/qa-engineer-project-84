- summary: |
    Отсутствует функционал «Фильтрация товара по цвету»
  environment: |
    Google Chrome 149.0 (официальная сборка)
    macOS 15 (Apple Silicon)
  steps-to-reproduce: |
    1. Зайти на сайт магазина https://products-store-ru.hexlet.app/
    2. Проверить наличие функции «Фильтрация товара по цвету»
  expected-result: |
    Отображается поле с фильтрацией товара по цвету
  actual-result: |
    Нет функционала «Фильтрация товара по цвету»

