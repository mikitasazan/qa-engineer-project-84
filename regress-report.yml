bugreports:
  - summary: |
      Нет сообщения пользователю о некорректно введенных данных при фильтрации товара по цене
    environment: |
      Google Chrome 149.0 (официальная сборка)
      macOS 15 (Apple Silicon)
    steps-to-reproduce: |
      1. Вводим диапазон цены от 0 до 0
    expected-result: |
      Отображается сообщение пользователю о некорректно введенных данных, товары не отображаются
    actual-result: |
      Нет сообщения пользователю о некорректно введенных данных, товары отображаются

  - summary: |
      Отсутствует кнопка «Следующая» (страница)при переходе в режим «Без категории» поиска товаров
    environment: |
      Google Chrome 149.0 (официальная сборка)
      macOS 15 (Apple Silicon)
    steps-to-reproduce: |
      1. Выбираем пустое поле в категории поиска товаров
    expected-result: |
      Отображение кнопки «Следующая» для перехода к другим страницам с товарами
    actual-result: |
      Отсутствие кнопки «следующая»

  - summary: |
      Ломается верстка сайта при выборе некоторых производителей товаров
    environment: |
      Google Chrome 149.0 (официальная сборка)
      macOS 15 (Apple Silicon)
    steps-to-reproduce: |
      1. Выбираем производителя OPPO
      2. Оцениваем внешний вид отобржаения товара
    expected-result: |
      Верстка не ломается
    actual-result: |
      Верстка ломается
