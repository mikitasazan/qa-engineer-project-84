    Доступ к последним версиям браузеров Google Chrome, Safari, Firefox
  test-data: |
    Нет данных
  steps:
    - Открываем браузер Google Chrome
    - Заходим на сайт https://products-store-ru.hexlet.app/
    - Оцениваем внешний вид сайта
    - Открываем браузер Safari
    - Заходим на сайт https://products-store-ru.hexlet.app/
    - Оцениваем внешний вид сайта
    - Открываем браузер Firefox
    - Заходим на сайт https://products-store-ru.hexlet.app/
    - Оцениваем внешний вид сайта
  expected-result: |
    Внешний вид приложения должен быть неизменным при его открытии в последних версиях браузеров

