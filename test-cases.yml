- summary: |
    Проверка адаптивности страницы
  requirement: |
    Сайт должен быть доступен на различных устройствах
  prerequisites: |
    Скопирована ссылка на приложение магазина
  test-data: |
    Нет данных
  steps:
    - Заходим на сайт
      http://adaptivator.ru/?site=https%3A%2F%2Fproducts-store-ru.hexlet.app%2F
    - Вставляем ссылку на приложение магазина в нужное поле
    - Проверяем адаптивность приложения на нескольких устройствах
  expected-result: |
    Внешний вид приложения должен быть неизменным на устройствах с различными разрешениями

- summary: |
    Проверка кроссбраузерности сайта
  requirement: |
    Сайт должен быть протестирован на совместимость с последними версиями браузеров
